project:
  name: "ChromaPeak"
  description: "LC-MS chromatographic peak detection and candidate validation"
paths:
  input_dir: "${CHROMAPEAK_LOCAL_ROOT}/artifacts/reproduction/data/raw_mzML"
  output_dir: "${CHROMAPEAK_LOCAL_ROOT}/artifacts/reproduction/results"
  xcms_output: "${CHROMAPEAK_LOCAL_ROOT}/artifacts/reproduction/results/xcms"
  ms_dial_output: "${CHROMAPEAK_LOCAL_ROOT}/artifacts/reproduction/results/ms_dial"
  pyopenms_output: "${CHROMAPEAK_LOCAL_ROOT}/artifacts/reproduction/results/pyopenms"
  asari_output: "${CHROMAPEAK_LOCAL_ROOT}/artifacts/reproduction/results/asari"
common_params:
  mz_tolerance_ppm: 10.0
  rt_tolerance_sec: 10.0
  n_workers: 4
parameters:
  xcms:
    peak_picking:
      method: "centWave"
      noise: 3000
      snthresh: 5
      ppm: 5
      peakwidth: [5, 50]
      prefilter_val: 3
      mzdiff: 0.001
    grouping:
      bw: 5
      minfrac: 0.5
    alignment:
      bin_size: 1.0
  pyopenms:
    peak_picking:
      noise: 500
      sn: 3
      mz_tol: 10.0
      min_fwhm: 2.5
      max_fwhm: 60.0
  msdial:
    input_dir: '${CHROMAPEAK_LOCAL_ROOT}/artifacts/reproduction/data/msdial'
    output_dir: '${CHROMAPEAK_LOCAL_ROOT}/artifacts/reproduction/results/msdial'
  asari:
    ppm: 10.0
    autoheight: False
    mode: 'pos'
    min_intensity_threshold: 1000
    min_peak_height: 5000
eic_export:
  enabled: false
  mzml: '${CHROMAPEAK_LOCAL_ROOT}/artifacts/reproduction/data/raw_mzML/NIST_Full scan_1_POS.mzML'
  method: 'nearest'
  unit: 'ppm'
  ppm: 10.0
  window_min: 2.0
  image_width_px: 480
  image_height_px: 480
  image_dpi: 150
  max_features: 200
  smooth_sigma: 0.0
