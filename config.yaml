project:
  name: "Lipidomics Algorithm Benchmark"
  description: "Comparing XCMS, MS-DIAL, pyOpenMS, and Asari"
paths:
  input_dir: "./data/raw_mzML"
  output_dir: "./results"
  xcms_output: "./results/xcms"
  ms_dial_output: "./results/ms_dial"
  pyopenms_output: "./results/pyopenms"
  asari_output: "./Results/asari"
common_params:
  mz_tolerance_ppm: 10.0
  rt_tolerance_sec: 10.0
  n_workers: 4
parameters:
  xcms:
    peak_picking:
      method: "centWave"
      noise: 2000
      snthresh: 5
      ppm: 10
      peakwidth: [5, 50]
      prefilter_val: 3
      mzdiff: 0.001
    grouping:
      bw: 5
      minfrac: 0.5
    alignment:
      bin_size: 1.0
  pyopenms:
    peak_picking:
      noise: 500
      sn: 5
      mz_tol: 10.0
      min_fwhm: 2.5
      max_fwhm: 60.0
  msdial:
    input_dir: './Data/msdial'
    output_dir: './Results/msdial'
  asari:
    ppm: 10.0
    autoheight: False
    mode: 'pos'
    min_intensity_threshold: 1000
    min_peak_height: 5000

  