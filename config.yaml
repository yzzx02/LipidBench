project:
  name: "Lipidomics Algorithm Benchmark"
  description: "Comparing XCMS, MS-DIAL, pyOpenMS, and Asari"
paths:
  input_dir: "./data/raw_mzML"
  output_dir: "./results"
  xcms_output: "./results/xcms"
  ms_dial_output: "./results/ms_dial"
  pyopenms_output: "./results/pyopenms"
  asari_output: "./Results/asari"
common_params:
  mz_tolerance_ppm: 10.0
  rt_tolerance_sec: 10.0
  n_workers: 4
parameters:
  xcms:
    peak_picking:
      method: "centWave"
      noise: 3000
      snthresh: 5
      ppm: 5
      peakwidth: [5, 50]
      prefilter_val: 3
      mzdiff: 0.001
    grouping:
      bw: 5
      minfrac: 0.5
    alignment:
      bin_size: 1.0
  pyopenms:
    peak_picking:
      noise: 500
      sn: 3
      mz_tol: 10.0
      min_fwhm: 2.5
      max_fwhm: 60.0
  msdial:
    input_dir: './Data/msdial'
    output_dir: './Results/msdial'
  asari:
    ppm: 10.0
    autoheight: False
    mode: 'pos'
    min_intensity_threshold: 1000
    min_peak_height: 5000
eic_export:
  enabled: false
  mzml: './data/raw_mzML/SERUM-1_copy_P1-E4_1_step1_1.mzML'
  method: 'nearest'
  unit: 'ppm'
  ppm: 10.0
  window_min: 2.0
  image_width_px: 400
  image_height_px: 300
  image_dpi: 100
  max_features: 200
  smooth_sigma: 0.0
